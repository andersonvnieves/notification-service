apiVersion: v1
kind: Namespace
metadata: { name: fgc }
---
apiVersion: v1
kind: Secret
metadata: { name: notification-worker-secrets, namespace: fgc }
type: Opaque
stringData:
  rabbitmq-uri: "amqp://admin:admin123@rabbitmq-service:5672/"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: notification-worker-config, namespace: fgc }
data:
  user-created-exchange: fgc
  user-created-routing-key: user.created
  payment-processed-exchange: fgc
  payment-processed-routing-key: payment.processed
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: admin }
            - { name: RABBITMQ_DEFAULT_PASS, value: admin123 }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq-service, namespace: fgc }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-worker, namespace: fgc }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-worker } }
  template:
    metadata: { labels: { app: notification-worker } }
    spec:
      containers:
        - name: notification-worker
          image: fgc-notification-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RabbitMQ__URI
              valueFrom: { secretKeyRef: { name: notification-worker-secrets, key: rabbitmq-uri } }
            - name: RabbitMQ__UserCreatedEvent__Exchange
              valueFrom: { configMapKeyRef: { name: notification-worker-config, key: user-created-exchange } }
            - name: RabbitMQ__UserCreatedEvent__RoutingKey
              valueFrom: { configMapKeyRef: { name: notification-worker-config, key: user-created-routing-key } }
            - name: RabbitMQ__PaymentProcessedEvent__Exchange
              valueFrom: { configMapKeyRef: { name: notification-worker-config, key: payment-processed-exchange } }
            - name: RabbitMQ__PaymentProcessedEvent__RoutingKey
              valueFrom: { configMapKeyRef: { name: notification-worker-config, key: payment-processed-routing-key } }
